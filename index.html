<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6ecf2" />
    <title>Secret Chamber Credits</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M3 10.8 12 3l9 7.8v9.1a1.1 1.1 0 0 1-1.1 1.1h-5.2v-6h-5.4v6H4.1A1.1 1.1 0 0 1 3 19.9z" />
      </symbol>
      <symbol id="icon-chat" viewBox="0 0 24 24">
        <path d="M5.3 5.2h13.4a2.3 2.3 0 0 1 2.3 2.3v7.4a2.3 2.3 0 0 1-2.3 2.3h-8.8L5 21v-3.8A2.3 2.3 0 0 1 3 14.9V7.5a2.3 2.3 0 0 1 2.3-2.3z" />
      </symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24">
        <path d="M18.5 10.3v3.8l1.8 3.1H3.7l1.8-3.1v-3.8A6.5 6.5 0 0 1 10.4 4a1.8 1.8 0 0 1 3.2 0 6.5 6.5 0 0 1 4.9 6.3zM9.3 19.2h5.4a2.7 2.7 0 0 1-5.4 0z" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <path d="M12 12.2a4.7 4.7 0 1 0 0-9.4 4.7 4.7 0 0 0 0 9.4zM4 21.2a8 8 0 0 1 16 0z" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="M21.3 3.3 3.2 10.5l8.2 2.1 2.1 8.2zM11.4 12.6l9.9-9.3" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.7" cy="10.7" r="6.7" />
        <path d="m15.8 15.8 4.2 4.2" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-crown" viewBox="0 0 24 24">
        <path d="M3.5 7.4 8.7 12l3.3-7 3.3 7 5.2-4.6-1.8 10.8H5.3z" />
      </symbol>
      <symbol id="icon-camera" viewBox="0 0 24 24">
        <path d="M8.1 6.5 9.7 4h4.6l1.6 2.5h3.5a1.8 1.8 0 0 1 1.8 1.8v9.8a1.8 1.8 0 0 1-1.8 1.8H4.6a1.8 1.8 0 0 1-1.8-1.8V8.3a1.8 1.8 0 0 1 1.8-1.8z" />
        <circle cx="12" cy="13.2" r="3.8" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9 7V5h6v2M7 7l1 14h8l1-14" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m4.5 12.5 5 5 10-11" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
    </svg>

    <div id="toastRegion" class="toast-region" aria-live="polite"></div>

    <main id="authView" class="auth-view">
      <section class="auth-panel">
        <div class="brand-mark">SCC</div>
        <h1>Secret Chamber Credits</h1>
        <form id="authForm" class="auth-form">
          <label>
            &#51060;&#47492;
            <input id="authName" autocomplete="name" maxlength="18" required />
          </label>
          <label>
            &#51064;&#51613;&#48264;&#54840; 4&#51088;&#47532;
            <input id="authPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit">&#51077;&#51109;</button>
          <p id="authError" class="form-error" role="alert"></p>
        </form>
      </section>
    </main>

    <main id="appView" class="app-shell is-hidden">
      <header class="topbar">
        <section class="hero-strip">
          <div>
            <p id="welcomeText" class="hero-kicker">Secret Chamber Credits</p>
            <h1 id="heroName">Wallet</h1>
          </div>
          <button id="profileShortcut" class="avatar-button" type="button" aria-label="Open profile"></button>
        </section>
        <div class="utility-row">
          <label class="search-box" aria-label="Search members">
            <svg><use href="#icon-search"></use></svg>
            <input id="searchInput" type="search" placeholder="&#51060;&#47492; &#44160;&#49353;" />
          </label>
          <div class="currency-switch" role="group" aria-label="Currency">
            <button id="krwMode" type="button" data-currency="krw" class="is-active">&#50896;</button>
            <button id="coinMode" type="button" data-currency="coin">&#53076;&#51064;</button>
          </div>
        </div>
      </header>

      <section id="homeTab" class="screen screen-home is-active" aria-labelledby="homeLabel">
        <div class="wallet-panel">
          <div class="wallet-copy">
            <span id="roleBadge" class="status-pill">Member</span>
            <p>My Wallet</p>
            <strong id="walletBalance">0</strong>
          </div>
          <button id="walletSendButton" class="round-action" type="button" aria-label="Transfer">
            <svg><use href="#icon-send"></use></svg>
          </button>
        </div>

        <section id="adminPanel" class="admin-panel is-hidden">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Operator</p>
              <h2>&#44288;&#47532;&#51088; Console</h2>
            </div>
            <button id="resetButton" class="icon-button danger" type="button" aria-label="Reset credits">
              <svg><use href="#icon-trash"></use></svg>
            </button>
          </div>
          <div class="admin-actions">
            <div id="seedAmountFields" class="amount-fields compact"></div>
            <button id="seedButton" class="primary-button" type="button">&#52488;&#44592; &#51088;&#48376; &#51648;&#44553;</button>
          </div>
        </section>

        <div class="section-heading people-heading">
          <div>
            <p class="eyebrow">Live Members</p>
            <h2>&#49324;&#50857;&#51088; &#47532;&#49828;&#53944;</h2>
          </div>
          <select id="peopleFilter" aria-label="Sort members">
            <option value="recent">Recent</option>
            <option value="name">Name</option>
            <option value="rank">Rank</option>
          </select>
        </div>
        <section id="peopleList" class="people-list"></section>

        <div class="section-heading">
          <div>
            <p class="eyebrow">Ledger</p>
            <h2>&#51060;&#46041; &#45236;&#50669;</h2>
          </div>
        </div>
        <section id="ledgerList" class="timeline-list"></section>
      </section>

      <section id="chatTab" class="screen screen-chat" aria-labelledby="chatLabel">
        <div id="chatList" class="chat-list"></div>
        <form id="chatForm" class="chat-composer">
          <input id="chatInput" maxlength="160" placeholder="Message" required />
          <button class="icon-button dark" type="submit" aria-label="Send">
            <svg><use href="#icon-send"></use></svg>
          </button>
        </form>
      </section>

      <section id="alertsTab" class="screen" aria-labelledby="alertsLabel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Updates</p>
            <h2>&#50508;&#47548;</h2>
          </div>
          <button id="markReadButton" class="soft-button" type="button">&#47784;&#46160; &#51069;&#51020;</button>
        </div>
        <section id="alertList" class="timeline-list"></section>
      </section>

      <section id="profileTab" class="screen" aria-labelledby="profileLabel">
        <section class="profile-panel">
          <div class="profile-photo-row">
            <button id="profilePhotoButton" class="profile-photo" type="button" aria-label="Change photo"></button>
            <label class="soft-button file-trigger">
              <svg><use href="#icon-camera"></use></svg>
              &#49324;&#51652;
              <input id="photoInput" type="file" accept="image/*" />
            </label>
          </div>
          <form id="profileForm" class="profile-form">
            <label>
              &#51060;&#47492;
              <input id="profileName" maxlength="18" required />
            </label>
            <label>
              &#48324;&#47749;
              <input id="profileAlias" maxlength="24" />
            </label>
            <button class="primary-button" type="submit">&#54532;&#47196;&#54596; &#51200;&#51109;</button>
            <button id="logoutButton" class="soft-button full" type="button">Logout</button>
            <p id="profileError" class="form-error" role="alert"></p>
          </form>
        </section>
      </section>

      <button id="fabButton" class="fab-button" type="button" aria-label="Transfer">
        <svg><use href="#icon-plus"></use></svg>
      </button>

      <nav class="bottom-nav" aria-label="Tabs">
        <button class="nav-item is-active" type="button" data-tab="home" id="homeLabel">
          <svg><use href="#icon-home"></use></svg>
          &#54856;
        </button>
        <button class="nav-item" type="button" data-tab="chat" id="chatLabel">
          <svg><use href="#icon-chat"></use></svg>
          &#52292;&#54021;
        </button>
        <span class="nav-spacer" aria-hidden="true"></span>
        <button class="nav-item" type="button" data-tab="alerts" id="alertsLabel">
          <svg><use href="#icon-bell"></use></svg>
          &#50508;&#47548;
          <span id="unreadDot" class="unread-dot is-hidden"></span>
        </button>
        <button class="nav-item" type="button" data-tab="profile" id="profileLabel">
          <svg><use href="#icon-user"></use></svg>
          &#54532;&#47196;&#54596;
        </button>
      </nav>
    </main>

    <dialog id="transferDialog" class="sheet-dialog">
      <form id="transferForm" method="dialog" class="sheet-card">
        <div class="sheet-head">
          <div>
            <p class="eyebrow">Transfer</p>
            <h2 id="transferTitle">&#53356;&#47112;&#46367; &#48372;&#45236;&#44592;</h2>
          </div>
          <button class="icon-button" value="cancel" type="button" data-close-dialog aria-label="Close">
            <svg><use href="#icon-x"></use></svg>
          </button>
        </div>
        <label>
          &#48155;&#45716; &#49324;&#46988;
          <select id="recipientSelect" required></select>
        </label>
        <div id="transferAmountFields" class="amount-fields"></div>
        <label>
          &#47700;&#47784;
          <input id="transferMemo" maxlength="40" placeholder="Optional" />
        </label>
        <button class="primary-button" type="submit">&#48372;&#45236;&#44592;</button>
        <p id="transferError" class="form-error" role="alert"></p>
      </form>
    </dialog>

    <dialog id="manageDialog" class="sheet-dialog">
      <form id="manageForm" method="dialog" class="sheet-card">
        <div class="sheet-head">
          <div>
            <p class="eyebrow">Adjust</p>
            <h2 id="manageTitle">&#44552;&#50529; &#51312;&#51221;</h2>
          </div>
          <button class="icon-button" value="cancel" type="button" data-close-dialog aria-label="Close">
            <svg><use href="#icon-x"></use></svg>
          </button>
        </div>
        <div class="adjust-toggle" role="group" aria-label="Adjust mode">
          <button type="button" data-adjust="add" class="is-active">+</button>
          <button type="button" data-adjust="subtract">-</button>
        </div>
        <div id="manageAmountFields" class="amount-fields"></div>
        <label>
          &#47700;&#47784;
          <input id="manageMemo" maxlength="40" placeholder="Optional" />
        </label>
        <button class="primary-button" type="submit">&#51201;&#50857;</button>
        <p id="manageError" class="form-error" role="alert"></p>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <span></span>
        <p></p>
      </div>
    </template>

    <script src="./app.js?v=5" defer></script>
  </body>
</html>
